[package]
name = "sediment"
version = "0.1.0"
description = "Sediment — local-first AI note-taking with a temporal knowledge graph"
authors = ["Collin Kueter"]
edition = "2021"
rust-version = "1.80"

[lib]
# The `_lib` suffix avoids name collisions on Windows; see https://github.com/rust-lang/cargo/issues/8519
name = "sediment_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
# Off by default so the standard build pulls no audio backend (ADR-0017 M2).
# Enable on macOS/Windows to compile the real microphone capture pipeline
# (`core::capture::MicSource` via cpal). System-output loopback and the on-device
# ASR engine land behind this (and a future `local-asr`) feature too.
default = []
audio = ["dep:cpal"]

[dependencies]
# --- Tauri ---
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
tauri-plugin-fs = "2"
tauri-plugin-notification = "2"

# --- Serialization ---
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# --- Errors / logging ---
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"

# --- Async runtime ---
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7" }

# --- Vault: file watcher and traversal ---
notify = "6"
notify-debouncer-full = "0.3"
walkdir = "2"

# --- Time ---
chrono = { version = "0.4", features = ["serde"] }

# --- SurrealDB (embedded; replaces FalkorDB + LanceDB + Graphiti per v0.2 spec) ---
# kv-surrealkv = file-backed embedded store. default-features = false drops the
# client/server protocol layers we don't need in-process.
surrealdb = { version = "3.0", default-features = false, features = ["kv-surrealkv"] }

# --- Ollama (M6) ---
ollama-rs = { version = "0.2", features = ["stream"] }
reqwest = { version = "0.12", features = ["json", "stream"] }

# --- Bundled in-process embedder (ADR-0014) — local semantic search with no
# Ollama daemon. fastembed runs an ONNX model in-process via `ort`; weights are
# fetched once to a cache dir on first use. nomic-embed-text-v1.5 = 768-d, which
# matches the existing HNSW index dimension.
fastembed = "4"

# --- Utility ---
uuid = { version = "1", features = ["v4", "serde"] }
futures = "0.3"
async-trait = "0.1"

# --- MCP server (ADR-0009 §5 — the graph-only stdio MCP server) ---
rmcp = { version = "0.16", features = ["server", "transport-io", "schemars"] }

# --- Audio capture (ADR-0017 M2, `audio` feature only) ---
# Cross-platform microphone capture. Optional so the default build is unchanged.
# cpal's Stream is !Send on some backends — `core::capture::MicSource` owns it on
# a dedicated thread accordingly.
cpal = { version = "0.15", optional = true }

[profile.dev]
incremental = true

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
