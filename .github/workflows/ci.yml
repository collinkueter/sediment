name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    name: Rust (clippy + test)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # Windows is in the matrix so the cfg!(windows) launch branches
        # (core::cli_launch and the engines) actually compile and their unit
        # tests run on the target OS, not just type-check in the macOS build.
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: cargo fmt
        run: cd src-tauri && cargo fmt --all -- --check
      # The default feature set (`desktop-audio`) links native audio + on-device
      # ASR backends that download a platform lib at build time — out of scope for
      # the headless runner. Build/test the pure path with `--no-default-features`,
      # then additionally type-check the mic-capture code (`audio`, no native ASR)
      # so it doesn't bit-rot. `local-asr` (native sherpa-onnx) is verified on
      # developer hardware, not here.
      - name: cargo clippy
        run: cd src-tauri && cargo clippy --all-targets --no-default-features -- -D warnings
      - name: cargo test
        run: cd src-tauri && cargo test --lib --no-default-features
      - name: cargo clippy (audio capture)
        run: cd src-tauri && cargo clippy --no-default-features --features audio -- -D warnings
      # Type-check the platform-specific loopback backends (ScreenCaptureKit on
      # macOS, WASAPI on Windows). `local-asr` is still excluded — sherpa-onnx
      # downloads a native lib at build time which CI runners can't do.
      - name: cargo clippy (loopback capture)
        run: cd src-tauri && cargo clippy --no-default-features --features audio,loopback -- -D warnings

  web:
    name: Web (typecheck + lint + build)
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: biome
        run: npx biome check src
      - name: tsc
        run: npx tsc --noEmit
      - name: vite build
        run: npm run build
